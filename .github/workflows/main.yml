name: Multi-Channel News Bot

on:
  schedule:
    - cron: '0 8 * * *'   # 8:00 AM UTC -> Runs Tech News
    - cron: '0 14 * * *'  # 2:00 PM UTC -> Runs Crypto News
  workflow_dispatch:
    inputs:
      channel:
        description: 'Which channel to run manually?'
        required: true
        default: 'FutureIntelligence'
        type: choice
        options:
          - FutureIntelligence
          - CryptoNews

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install google-generativeai edge-tts moviepy==1.0.3 requests python-dotenv feedparser pytz pillow imageio-ffmpeg google-api-python-client google-auth-oauthlib
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fontconfig fonts-noto-core
          sudo sed -i 's/rights="none"/rights="read|write"/g' /etc/ImageMagick-6/policy.xml
          
      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Pass both tokens simultaneously. Your Python script will use the correct one.
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_TOKEN_2: ${{ secrets.YOUTUBE_TOKEN_2 }}
        run: python youtube_bot.py ${{ github.event.inputs.channel || 'FutureIntelligence' }}
