name: Daily Multi-Language News Generator

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies, Fonts & ImageMagick
        run: |
          pip install google-generativeai edge-tts moviepy==1.0.3 requests python-dotenv feedparser pytz pillow imageio-ffmpeg google-api-python-client google-auth-oauthlib
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fontconfig fonts-noto fonts-noto-core fonts-noto-extra
          sudo sed -i 's/rights="none"/rights="read|write"/g' /etc/ImageMagick-6/policy.xml
          
      - name: Create YouTube Token File
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN }}' > token.json
          
      - name: Run News Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python youtube_bot.py
      
      - name: Save 48h News History
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news_history.json
          git commit -m "Update 48h news history [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push || echo "⚠️ Push failed, but artifacts are safe."
          
      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: news-broadcast-assets
          path: |
            final_news_*.mp4
            subtitles_*.srt
            thumbnail_*.jpg
            youtube_metadata_*.txt
            shorts_*.mp4
          retention-days: 3
          if-no-files-found: warn
