name: AI News YouTube Bot

on:
  schedule:
    - cron: "0 8 * * *"      # 8:00 AM UTC
    - cron: "0 20 * * *"     # 8:00 PM UTC
  workflow_dispatch:         # Allows you to trigger it manually

jobs:
  post-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-roboto

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser edge-tts moviepy==1.0.3 Pillow google-api-python-client google-auth-oauthlib imageio-ffmpeg requests
      - name: Run AI News Bot
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: python main.py

      - name: Commit used articles log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_articles.txt || true
          git commit -m "Update used articles log" || true
          git push || true
